<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 816" role="img" aria-labelledby="t1">
  <title id="t1">Grabado: satélite con paneles solares sobre el limbo de la Tierra, enviando una respuesta a una estación en Svalbard</title>
  <defs>
    <pattern id="h1" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#1A1714" stroke-width="1.6"/>
    </pattern>
    <pattern id="h2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1A1714" stroke-width="1.1"/>
    </pattern>
    <pattern id="h3" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <line x1="0" y1="0" x2="0" y2="11" stroke="#1A1714" stroke-width="0.9"/>
    </pattern>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#1A1714" stroke-width="1.2"/>
    </pattern>
    <clipPath id="earth"><circle cx="728" cy="2350" r="1800"/></clipPath>
  </defs>

  <rect width="1456" height="816" fill="#1A1714"/>
  <!-- cielo: estrellas grabadas -->
  <g fill="#FAF7EE">
    <circle cx="96" cy="88" r="2"/><circle cx="212" cy="190" r="1.4"/><circle cx="330" cy="64" r="2.4"/>
    <circle cx="452" cy="160" r="1.2"/><circle cx="1012" cy="72" r="1.6"/><circle cx="1120" cy="180" r="2.2"/>
    <circle cx="1260" cy="96" r="1.3"/><circle cx="1380" cy="210" r="1.8"/><circle cx="60" cy="300" r="1.3"/>
    <circle cx="1410" cy="40" r="1.2"/><circle cx="560" cy="48" r="1.1"/><circle cx="880" cy="36" r="1.5"/>
    <circle cx="160" cy="420" r="1.1"/><circle cx="1330" cy="330" r="1.2"/><circle cx="260" cy="320" r="1.6"/>
  </g>

  <!-- Sol en la esquina, rayos de grabado -->
  <g transform="translate(1320 120)" stroke="#C9A84C" stroke-width="2">
    <circle r="46" fill="#C9A84C"/>
    <g id="rays">
      <line x1="60" y1="0" x2="120" y2="0"/><line x1="-60" y1="0" x2="-120" y2="0"/>
      <line x1="0" y1="60" x2="0" y2="120"/><line x1="0" y1="-60" x2="0" y2="-100"/>
      <line x1="44" y1="44" x2="90" y2="90"/><line x1="-44" y1="44" x2="-90" y2="90"/>
      <line x1="44" y1="-44" x2="76" y2="-76"/><line x1="-44" y1="-44" x2="-80" y2="-80"/>
    </g>
  </g>

  <!-- Tierra: limbo con tramado -->
  <circle cx="728" cy="2350" r="1800" fill="#FAF7EE"/>
  <g clip-path="url(#earth)">
    <rect x="0" y="500" width="1456" height="320" fill="url(#h3)"/>
    <path d="M300 640 C 420 590, 560 610, 640 650 C 720 690, 820 640, 900 600 C 1000 560, 1120 600, 1180 660 L 1180 816 L 300 816 Z" fill="url(#h1)"/>
    <path d="M820 620 c 30 -24 70 -30 96 -10 c 20 14 6 40 -24 44 c -30 4 -60 -12 -72 -34 Z" fill="#1A1714"/>
    <path d="M1060 640 c 40 -20 90 -8 100 20 c 8 22 -34 32 -64 22 c -24 -8 -40 -26 -36 -42 Z" fill="url(#h2)"/>
  </g>
  <circle cx="728" cy="2350" r="1800" fill="none" stroke="#C9A84C" stroke-width="3"/>
  <circle cx="728" cy="2350" r="1822" fill="none" stroke="#C9A84C" stroke-width="1" stroke-dasharray="2 8"/>

  <!-- Estación de tierra en Svalbard -->
  <g transform="translate(1004 586)">
    <path d="M-16 20 L0 -6 L16 20 Z" fill="#1A1714"/>
    <path d="M-22 -10 A 26 26 0 0 0 22 -20" fill="none" stroke="#1A1714" stroke-width="4"/>
    <line x1="0" y1="-6" x2="6" y2="-24" stroke="#1A1714" stroke-width="3"/>
  </g>
  <text x="1040" y="664" font-family="'Courier Prime', 'Courier New', monospace" font-size="20" fill="#1A1714" letter-spacing="2">SVALBARD · 78° N</text>

  <!-- Enlace de bajada: el haiku -->
  <path d="M760 352 C 860 420, 940 500, 1002 560" fill="none" stroke="#C9A84C" stroke-width="3" stroke-dasharray="10 9"/>
  <g font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" fill="#C9A84C" font-size="26">
    <text x="880" y="404" transform="rotate(33 880 404)">cinco · siete · cinco</text>
  </g>

  <!-- Órbita -->
  <ellipse cx="728" cy="420" rx="620" ry="120" fill="none" stroke="#FAF7EE" stroke-width="1.2" stroke-dasharray="3 10" opacity="0.7"/>

  <!-- Satélite -->
  <g transform="translate(700 330) rotate(-14)">
    <!-- panel izquierdo -->
    <rect x="-330" y="-46" width="250" height="92" fill="url(#grid)" stroke="#FAF7EE" stroke-width="3"/>
    <rect x="-330" y="-46" width="250" height="92" fill="#FAF7EE" opacity="0.18"/>
    <line x1="-80" y1="0" x2="-48" y2="0" stroke="#FAF7EE" stroke-width="5"/>
    <!-- cuerpo -->
    <rect x="-48" y="-58" width="96" height="116" fill="#FAF7EE" stroke="#FAF7EE" stroke-width="2"/>
    <rect x="-48" y="-58" width="96" height="116" fill="url(#h2)"/>
    <rect x="-26" y="-24" width="52" height="48" fill="#C9A84C" stroke="#1A1714" stroke-width="3"/>
    <g stroke="#1A1714" stroke-width="2.5">
      <line x1="-18" y1="-24" x2="-18" y2="-34"/><line x1="-6" y1="-24" x2="-6" y2="-34"/><line x1="6" y1="-24" x2="6" y2="-34"/><line x1="18" y1="-24" x2="18" y2="-34"/>
      <line x1="-18" y1="24" x2="-18" y2="34"/><line x1="-6" y1="24" x2="-6" y2="34"/><line x1="6" y1="24" x2="6" y2="34"/><line x1="18" y1="24" x2="18" y2="34"/>
    </g>
    <text x="0" y="6" text-anchor="middle" font-family="'Courier Prime', 'Courier New', monospace" font-size="15" font-weight="700" fill="#1A1714">TPU</text>
    <!-- panel derecho -->
    <line x1="48" y1="0" x2="80" y2="0" stroke="#FAF7EE" stroke-width="5"/>
    <rect x="80" y="-46" width="250" height="92" fill="url(#grid)" stroke="#FAF7EE" stroke-width="3"/>
    <rect x="80" y="-46" width="250" height="92" fill="#FAF7EE" opacity="0.18"/>
    <!-- radiador -->
    <rect x="-30" y="58" width="60" height="70" fill="#1A1714" stroke="#FAF7EE" stroke-width="2"/>
    <g stroke="#FAF7EE" stroke-width="2"><line x1="-20" y1="66" x2="-20" y2="122"/><line x1="-6" y1="66" x2="-6" y2="122"/><line x1="8" y1="66" x2="8" y2="122"/><line x1="22" y1="66" x2="22" y2="122"/></g>
    <!-- antena -->
    <line x1="0" y1="-58" x2="0" y2="-96" stroke="#FAF7EE" stroke-width="3"/>
    <circle cx="0" cy="-100" r="6" fill="#C9A84C"/>
  </g>

  <!-- cartela -->
  <rect x="40" y="734" width="740" height="64" fill="#FAF7EE"/>
  <g font-family="'Courier Prime', 'Courier New', monospace" fill="#1A1714" letter-spacing="3" font-size="18">
    <text x="56" y="760" font-weight="700">OCHIN KRASO · ROBÓTICA</text>
    <text x="56" y="786" fill="#8B4513">LÁM. I — PRIMERA RESPUESTA DESDE ÓRBITA · 30.X.2026</text>
  </g>
</svg>
