<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 760" role="img" aria-labelledby="t3">
  <title id="t3">Grabado: rover en el borde de un cráter marciano siguiendo una ruta de puntos propuesta por IA y validada en simulación</title>
  <defs>
    <pattern id="m1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8B4513" stroke-width="1.5"/>
    </pattern>
    <pattern id="m2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#8B4513" stroke-width="1"/>
    </pattern>
    <pattern id="m3" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(60)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#1A1714" stroke-width="1.3"/>
    </pattern>
  </defs>
  <rect width="1456" height="760" fill="#FAF7EE"/>
  <!-- cielo con tramado suave -->
  <rect x="0" y="0" width="1456" height="300" fill="url(#m2)" opacity="0.55"/>
  <circle cx="1240" cy="120" r="34" fill="#FAF7EE" stroke="#1A1714" stroke-width="2"/>
  <circle cx="1240" cy="120" r="34" fill="url(#m3)" opacity="0.4"/>

  <!-- relieve lejano -->
  <path d="M0 300 C 140 250, 260 270, 380 240 C 520 205, 640 260, 780 236 C 920 210, 1060 250, 1200 226 C 1320 206, 1400 230, 1456 222 L1456 340 L0 340 Z" fill="url(#m1)"/>
  <!-- borde del cráter -->
  <path d="M0 420 C 200 360, 420 380, 640 360 C 860 340, 1080 380, 1456 350 L1456 760 L0 760 Z" fill="#FAF7EE"/>
  <path d="M0 420 C 200 360, 420 380, 640 360 C 860 340, 1080 380, 1456 350" fill="none" stroke="#1A1714" stroke-width="3"/>
  <path d="M0 520 C 260 470, 520 500, 760 470 C 1000 440, 1200 490, 1456 460 L1456 760 L0 760 Z" fill="url(#m2)"/>
  <!-- rocas -->
  <g fill="#1A1714">
    <path d="M300 560 c 14 -14 40 -12 46 4 c 4 12 -20 18 -36 14 c -10 -2 -14 -10 -10 -18 Z"/>
    <path d="M900 600 c 20 -16 56 -10 60 8 c 2 14 -28 20 -46 14 c -12 -4 -18 -12 -14 -22 Z"/>
    <path d="M1180 520 c 10 -10 30 -8 34 4 c 2 8 -14 12 -26 10 c -8 -2 -10 -8 -8 -14 Z"/>
    <path d="M560 640 c 16 -10 40 -6 42 8 c 2 10 -20 14 -32 10 c -8 -2 -12 -10 -10 -18 Z"/>
  </g>

  <!-- ruta por puntos -->
  <path d="M190 660 C 330 610, 420 560, 560 540 C 700 520, 780 470, 900 450 C 1020 430, 1110 420, 1260 400" fill="none" stroke="#1A1714" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
  <g fill="#FAF7EE" stroke="#1A1714" stroke-width="3">
    <circle cx="190" cy="660" r="9"/><circle cx="380" cy="584" r="9"/><circle cx="560" cy="540" r="9"/>
    <circle cx="740" cy="496" r="9"/><circle cx="900" cy="450" r="9"/><circle cx="1080" cy="424" r="9"/>
  </g>
  <circle cx="1260" cy="400" r="12" fill="#C9A84C" stroke="#1A1714" stroke-width="3"/>
  <g font-family="'Courier Prime', 'Courier New', monospace" font-size="17" fill="#1A1714" letter-spacing="2">
    <text x="140" y="700">SOL 1707</text>
    <text x="1196" y="372">SOL 1709</text>
    <text x="640" y="610">≈ 456 m</text>
  </g>

  <!-- rover -->
  <g transform="translate(470 520)">
    <rect x="-70" y="-60" width="140" height="44" fill="#FAF7EE" stroke="#1A1714" stroke-width="3"/>
    <rect x="-70" y="-60" width="140" height="44" fill="url(#m3)" opacity="0.6"/>
    <rect x="-80" y="-70" width="160" height="12" fill="#1A1714"/>
    <line x1="40" y1="-70" x2="40" y2="-118" stroke="#1A1714" stroke-width="5"/>
    <rect x="22" y="-136" width="38" height="20" fill="#1A1714"/>
    <circle cx="52" cy="-126" r="5" fill="#C9A84C"/>
    <line x1="-50" y1="-70" x2="-50" y2="-96" stroke="#1A1714" stroke-width="3"/>
    <circle cx="-50" cy="-100" r="8" fill="none" stroke="#1A1714" stroke-width="3"/>
    <path d="M-60 -16 L -64 4 M 0 -16 L 0 4 M 60 -16 L 64 4" stroke="#1A1714" stroke-width="4"/>
    <g fill="#FAF7EE" stroke="#1A1714" stroke-width="4">
      <circle cx="-64" cy="16" r="16"/><circle cx="0" cy="16" r="16"/><circle cx="64" cy="16" r="16"/>
    </g>
    <g fill="#1A1714"><circle cx="-64" cy="16" r="5"/><circle cx="0" cy="16" r="5"/><circle cx="64" cy="16" r="5"/></g>
  </g>

  <!-- Recuadro: validación en gemelo digital -->
  <g transform="translate(980 560)">
    <rect x="0" y="0" width="400" height="140" fill="#FAF7EE" stroke="#1A1714" stroke-width="2.4"/>
    <rect x="8" y="8" width="384" height="124" fill="none" stroke="#1A1714" stroke-width="0.8"/>
    <text x="24" y="44" font-family="'Courier Prime', 'Courier New', monospace" font-size="16" letter-spacing="2" fill="#8B4513">1 · LA IA PROPONE LA RUTA</text>
    <text x="24" y="78" font-family="'Courier Prime', 'Courier New', monospace" font-size="16" letter-spacing="2" fill="#8B4513">2 · SE PRUEBA EN SIMULACIÓN</text>
    <text x="24" y="112" font-family="'Courier Prime', 'Courier New', monospace" font-size="16" letter-spacing="2" fill="#1A1714" font-weight="700">3 · EL EQUIPO LA ENVÍA</text>
  </g>

  <g font-family="'Courier Prime', 'Courier New', monospace" font-size="17" letter-spacing="3">
    <rect x="40" y="712" width="800" height="34" fill="#FAF7EE"/>
    <text x="56" y="736" fill="#1A1714" font-weight="700">OCHIN KRASO · ROBÓTICA</text>
    <text x="372" y="736" fill="#8B4513">LÁM. III — JEZERO, DICIEMBRE DE 2025</text>
  </g>
</svg>
